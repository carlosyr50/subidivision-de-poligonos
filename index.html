<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subdivisión de Predios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Distribución: barra superior 56px · panel izquierdo 320px · lienzo CAD · panel de propiedades · línea de comandos y barra de estado abajo */
:root{
  --bg:#eef1f6; --surface:#ffffff; --line:#e3e8ef; --line-2:#d3dbe6;
  --text:#14213d; --text-2:#64708a; --hint:#97a2b6;
  --accent:#2f62e8; --accent-h:#1f4fd1; --accent-soft:#eaf0fe;
  --ok:#0f9d74; --err:#d23b30; --err-soft:#fcebea;
  --neutral-soft:#f0f2f6; --canvas:#ffffff; --grid:#eef1f6; --poly:#5f6b85;
  --font-ui:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --left-w:320px; --right-w:392px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1422; --surface:#151d2e; --line:#222c40; --line-2:#2d3950;
    --text:#e5eaf4; --text-2:#9aa5bd; --hint:#68748e;
    --accent:#5b86f2; --accent-h:#7b9df5; --accent-soft:#1b2848;
    --ok:#2cb88e; --err:#ec5d52; --err-soft:#3a1f22;
    --neutral-soft:#1c2436; --canvas:#111827; --grid:#1a2335; --poly:#8d99b3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1422; --surface:#151d2e; --line:#222c40; --line-2:#2d3950;
  --text:#e5eaf4; --text-2:#9aa5bd; --hint:#68748e;
  --accent:#5b86f2; --accent-h:#7b9df5; --accent-soft:#1b2848;
  --ok:#2cb88e; --err:#ec5d52; --err-soft:#3a1f22;
  --neutral-soft:#1c2436; --canvas:#111827; --grid:#1a2335; --poly:#8d99b3;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}

#app{display:grid;height:100%;
  grid-template-columns:var(--left-w) minmax(0,1fr) var(--right-w);
  grid-template-rows:56px minmax(0,1fr) auto 30px;
  grid-template-areas:"top top top" "left main right" "left cmd right" "status status status"}

/* ---- barra superior ---- */
.topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}
.brand svg{flex:none}
.brand b{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .src{color:var(--hint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line-2);color:inherit}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.btn.danger.primary{background:var(--err);border-color:var(--err);color:#fff}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.only-narrow{display:none}
.dropdown{position:relative}

/* ---- paneles ---- */
.panel{background:var(--surface);overflow:auto;min-height:0}
.left{grid-area:left;border-right:1px solid var(--line);display:flex;flex-direction:column}
.right{grid-area:right;border-left:1px solid var(--line)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec.grow{flex:1;min-height:120px;display:flex;flex-direction:column}
.sec-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-bottom:10px}
.sec-h .count{color:var(--hint);font-weight:500}
.tools{display:grid;gap:4px}
.toolbtn{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:1px solid transparent;background:transparent;border-radius:6px;text-align:left;font-weight:500}
.toolbtn:hover{background:var(--neutral-soft)}
.toolbtn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.toolbtn:disabled{opacity:.45;cursor:default;background:transparent}
.toolbtn kbd,.kbd{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--hint);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface)}
.search{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--surface);margin-bottom:8px}
.search:focus{border-color:var(--accent);outline:none}
.list{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;flex:1}
.item{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:6px;cursor:pointer}
.item:hover{background:var(--neutral-soft)}
.item.on{background:var(--accent-soft)}
.item.on .nm{color:var(--accent);font-weight:600}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{color:var(--hint);font-size:11px}
.item .ar{font-family:var(--font-mono);font-size:11.5px;color:var(--text-2)}
.item .acts{display:none;gap:2px;position:absolute;right:6px;background:inherit;padding-left:6px}
.item:hover .acts{display:flex}
.item:hover .ar{visibility:hidden}
.mini{width:24px;height:24px;border:0;background:transparent;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
.mini:hover{background:var(--surface);color:var(--accent)}
.mini.del:hover{color:var(--err)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--hint);display:inline-block}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.acc{background:var(--accent)}
.empty{color:var(--hint);font-size:12.5px;padding:8px 2px}
.linkbtn{border:0;background:transparent;padding:0;color:var(--text-2);display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;width:100%}
.linkbtn:hover{color:var(--accent)}
.chev{transition:transform .15s}
.open .chev{transform:rotate(90deg)}

/* ---- panel de subdivisión ---- */
.subhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.subhead .t{flex:1;min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.subhead .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;text-align:left;padding:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.card:hover{border-color:var(--line-2);background:var(--neutral-soft)}
.card.on{border-color:var(--accent);background:var(--accent-soft)}
.card svg{width:112px;height:68px;display:block;background:var(--surface);border-radius:5px;border:1px solid var(--line)}
.card b{display:block;font-size:13px;font-weight:600}
.card.on b{color:var(--accent)}
.card p{margin:2px 0 0;color:var(--text-2);font-size:12px;line-height:1.35}
.anim .a2{fill:var(--neutral-soft)}
.anim .a1{fill:var(--accent-soft);opacity:.95}
.card.on .anim .a1{fill:var(--accent);opacity:.22}
.anim .cut{stroke:var(--accent);stroke-width:1.6}
.anim .outline{fill:none;stroke:var(--text-2);stroke-width:1}
.anim .ref{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.anim .pt{fill:var(--accent)}
.live{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:14px 28px 1fr auto;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;border:1px solid var(--line)}
.lrow.a1{background:var(--accent-soft);border-color:var(--accent)}
.lrow.a2{background:var(--neutral-soft)}
.lrow.bad{background:var(--err-soft);border-color:var(--err)}
.lrow .k{font-weight:700}
.lrow .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.lrow .p{font-family:var(--font-mono);font-size:11.5px;color:var(--text-2);min-width:58px;text-align:right}
.sw{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--accent);background:var(--accent-soft)}
.sw.a2{border-color:var(--line-2);background:var(--neutral-soft)}
.sw.bad{border-color:var(--err);background:var(--err-soft)}
.ltot{display:flex;justify-content:space-between;padding:2px 10px;color:var(--text-2);font-size:12px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text-2)}
.note .dot{margin-top:5px}
.note.err{color:var(--err)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px;color:var(--text-2);align-items:center}
.keys .kbd{margin:0;justify-self:start}

/* ---- propiedades ---- */
.props-h{display:flex;align-items:center;gap:8px}
.namein{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:15px;font-weight:600;background:var(--surface);margin:8px 0 4px}
.namein:hover{border-color:var(--line-2)}
.namein:focus{border-color:var(--accent);outline:none}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--surface);padding:8px 10px}
.stat .l{font-size:11px;color:var(--text-2)}
.stat .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:500}
.stat .v small{font-size:11px;color:var(--text-2);font-weight:400}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.vt{border-collapse:collapse;width:100%;font-size:10.5px}
.vt th{font-weight:600;font-size:10px;letter-spacing:.02em;text-transform:uppercase;color:var(--text-2);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);background:var(--neutral-soft);white-space:nowrap}
.vt td{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.vt th:first-child,.vt td:first-child{text-align:center}
.vt tr:last-child td{border-bottom:0}
.vt tfoot td{background:var(--neutral-soft);font-weight:600}
.vt td.vx{color:var(--accent);font-weight:600}
.rowh{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.meta{font-size:12px;color:var(--text-2);display:grid;gap:4px}
.meta b{color:var(--text);font-weight:500}

/* ---- lienzo ---- */
.main{grid-area:main;position:relative;overflow:hidden;background:var(--canvas)}
#cv{position:absolute;inset:0;display:block;touch-action:none;cursor:default}
#cv.cross{cursor:crosshair}
#cv.grab{cursor:grab}
#cv.grabbing{cursor:grabbing}
.dyn{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px;display:grid;gap:4px;box-shadow:0 1px 3px rgba(20,33,61,.08);pointer-events:auto}
.dyn label{display:grid;grid-template-columns:62px 112px 22px;align-items:center;gap:6px;font-size:11px;color:var(--text-2)}
.dyn input{height:24px;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-family:var(--font-mono);font-size:12px;background:var(--surface);text-align:right;width:100%}
.dyn input:focus{border-color:var(--accent);outline:none}
.dyn input.locked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dyn input.bad{border-color:var(--err);background:var(--err-soft);color:var(--err)}
.dyn .hint{font-size:10.5px;color:var(--hint);padding:0 2px}
.snaptip{position:absolute;z-index:6;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);color:var(--accent);font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap}
.menu{position:absolute;z-index:20;min-width:190px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:4px;box-shadow:0 4px 14px rgba(20,33,61,.10)}
.menu .mh{padding:6px 10px 4px;font-size:11px;color:var(--text-2)}
.menu .mh b{display:block;color:var(--text);font-size:13px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;height:30px;border:0;background:transparent;border-radius:5px;padding:0 10px;text-align:left}
.menu button:hover{background:var(--accent-soft);color:var(--accent)}
.menu button:disabled{opacity:.4;background:transparent;color:inherit;cursor:default}
.menu button .kbd{margin-left:auto}
.menu button.del:hover{background:var(--err-soft);color:var(--err)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.hovermenu{padding:4px}
.drop{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(47,98,232,.08);border:2px dashed var(--accent);color:var(--accent);font-weight:600;pointer-events:none}

/* ---- línea de comandos ---- */
.cmd{grid-area:cmd;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px 8px}
.cmdlog{height:54px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;color:var(--text-2)}
.cmdlog div{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}
.cmdlog div.err{color:var(--err)}
.cmdlog div.cmdl{color:var(--hint);font-family:var(--font-mono);font-size:11.5px}
.cmdrow{display:flex;align-items:center;gap:8px;height:32px;border:1px solid var(--line-2);border-radius:6px;padding:0 10px;margin-top:4px}
.cmdrow:focus-within{border-color:var(--accent)}
.cmdprompt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.cmdprompt.err{color:var(--err)}
#cmdInput{flex:1;min-width:60px;border:0;outline:none;background:transparent;font-family:var(--font-mono);font-size:12.5px}
.statusbar{grid-area:status;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--surface);border-top:1px solid var(--line);font-size:12px;color:var(--text-2);overflow:hidden}
.statusbar .coords{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
.statusbar .coords span{color:var(--hint);margin-right:4px}
.tog{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border:1px solid transparent;border-radius:4px;background:transparent;font-size:11.5px;font-weight:600;color:var(--text-2);letter-spacing:.03em}
.tog:hover{border-color:var(--line-2)}
.tog .dot{width:6px;height:6px}
.tog.on{color:var(--text)}
.tog.on .dot{background:var(--accent)}
.sb-sep{width:1px;height:16px;background:var(--line)}

/* ---- modal ---- */
.modalback{position:fixed;inset:0;z-index:50;background:rgba(14,20,34,.32);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(520px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column}
.modal h2{margin:0;font-size:16px;font-weight:600;padding:16px 18px 0;text-wrap:balance}
.modal .mb{padding:10px 18px;overflow:auto;color:var(--text-2)}
.modal .mb p{margin:6px 0}
.modal .ma{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;flex-wrap:wrap}
.modal textarea{width:100%;height:220px;border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--font-mono);font-size:11.5px;background:var(--neutral-soft);color:var(--text);resize:vertical}
.form{display:grid;gap:12px}
.form label{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;color:var(--text)}
.form label small{display:block;color:var(--hint);font-size:11.5px}
.form select,.form input[type=number]{height:30px;border:1px solid var(--line-2);border-radius:6px;padding:0 8px;background:var(--surface)}

@media (prefers-reduced-motion: reduce){ .chev{transition:none} }

@media (max-width: 1280px){ :root{--left-w:290px;--right-w:360px} }
@media (max-width: 900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main" "cmd" "status"}
  .left,.right{position:fixed;top:56px;bottom:30px;z-index:30;width:min(340px,88vw);display:none}
  .left{left:0}.right{right:0}
  #app.show-left .left{display:flex}
  #app.show-right .right{display:block}
  .only-narrow{display:inline-flex}
  .hide-narrow{display:none}
  .brand .src{display:none}
  .cmdprompt{max-width:45%}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="btn icon ghost only-narrow" id="btnLeft" title="Panel de polígonos" aria-label="Panel de polígonos">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3.5 18.5 6 4.5h12.5l2 14z" stroke="#2f62e8" stroke-width="1.6" stroke-linejoin="round"/><path d="M12.6 4.5 11 18.5" stroke="#2f62e8" stroke-width="1.6"/><path d="M6 4.5h6.6L11 18.5H3.5z" fill="#2f62e8" opacity=".16"/></svg>
      <b>Subdivisión de Predios</b>
      <span class="src" id="srcInfo"></span>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnImport" title="Importar JSON (EXTRAEPOL o formato mínimo)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0 3-3m-3 3L5 7M2.5 11v2.5h11V11"/></svg><span class="hide-narrow">Importar</span>
    </button>
    <div class="dropdown">
      <button class="btn" id="btnExport" title="Exportar">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 10V2m0 0L5 5m3-3 3 3M2.5 11v2.5h11V11"/></svg><span class="hide-narrow">Exportar</span>
      </button>
      <div class="menu" id="exportMenu" hidden style="right:0;top:38px">
        <button data-exp="json">JSON de geometría<span class="kbd">.json</span></button>
        <button data-exp="csv">Coordenadas de lotes nuevos<span class="kbd">.csv</span></button>
      </div>
    </div>
    <span class="sep hide-narrow"></span>
    <button class="btn icon ghost" id="btnUndo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6h7a4 4 0 0 1 0 8H7"/></svg>
    </button>
    <button class="btn icon ghost" id="btnRedo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m10.5 3 3 3-3 3"/><path d="M13.5 6h-7a4 4 0 0 0 0 8H9"/></svg>
    </button>
    <button class="btn icon ghost" id="btnSettings" title="Ajustes" aria-label="Ajustes">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
    </button>
    <button class="btn icon ghost only-narrow" id="btnRight" title="Propiedades" aria-label="Propiedades">

<!-- ======================================================================
     (a) NÚCLEO GEOMÉTRICO PURO — sin DOM. tests.js lo extrae y lo prueba.
     Puntos como [E, N] en metros.
     ====================================================================== -->
<script id="geo-core">
const GEO = (function () {
  'use strict';
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const mul = (a, k) => [a[0] * k, a[1] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
  const len = a => Math.hypot(a[0], a[1]);
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const norm = a => { const l = len(a); return l ? [a[0] / l, a[1] / l] : [0, 0]; };
  const rotate = (v, ang) => { const c = Math.cos(ang), s = Math.sin(ang); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c]; };
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

  // Área con signo (positiva = antihorario). Se calcula relativa al primer
  // vértice para no perder precisión con coordenadas UTM grandes.
  function signedArea(pts) {
    const n = pts.length; if (n < 3) return 0;
    const o = pts[0]; let s = 0;
    for (let i = 1; i < n - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      s += (a[0] - o[0]) * (b[1] - o[1]) - (b[0] - o[0]) * (a[1] - o[1]);
    }
    return s / 2;
  }
  const area = pts => Math.abs(signedArea(pts));
  function perimeter(pts) { let s = 0; for (let i = 0; i < pts.length; i++) s += dist(pts[i], pts[(i + 1) % pts.length]); return s; }
  const isClockwise = pts => signedArea(pts) < 0;

  // Sentido horario conservando el vértice 1.
  function toClockwise(pts) {
    if (signedArea(pts) > 0) return [pts[0]].concat(pts.slice(1).reverse());
    return pts.slice();
  }
  // Empieza en el vértice más al norte (empate: el de menor Este).
  function rotateToNorth(pts) {
    let k = 0;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = pts[k];
      if (p[1] > q[1] + 1e-9 || (Math.abs(p[1] - q[1]) <= 1e-9 && p[0] < q[0])) k = i;
    }
    return pts.slice(k).concat(pts.slice(0, k));
  }

  // Ángulos internos en radianes, para cualquier sentido de giro.
  function interiorAngles(pts) {
    const n = pts.length, ccw = signedArea(pts) > 0, TAU = Math.PI * 2;
    return pts.map((B, i) => {
      const A = pts[(i - 1 + n) % n], C = pts[(i + 1) % n];
      const a1 = Math.atan2(A[1] - B[1], A[0] - B[0]);
      const a2 = Math.atan2(C[1] - B[1], C[0] - B[0]);
      let ang = ccw ? a1 - a2 : a2 - a1;
      ang = ((ang % TAU) + TAU) % TAU;
      return ang;
    });
  }

  // Sexagesimal al segundo, siempre con minutos y segundos: 90°00'00"
  function formatDMS(deg) {
    if (!isFinite(deg)) return '—';
    const neg = deg < 0; let t = Math.round(Math.abs(deg) * 3600);
    const d = Math.floor(t / 3600); t -= d * 3600;
    const m = Math.floor(t / 60); const s = t - m * 60;
    return (neg ? '-' : '') + d + '°' + String(m).padStart(2, '0') + "'" + String(s).padStart(2, '0') + '"';
  }
  // Acepta 45.5 · 45°30'15" · 45 30 15 · 45d30m15s · 45-30-15
  function parseAngle(str) {
    let s = String(str == null ? '' : str).trim().replace(/º/g, '°').replace(/,/g, '.');
    if (!s) return NaN;
    let m = s.match(/^(-?\d+(?:\.\d+)?)\s*°?$/);
    if (m) return +m[1];
    m = s.match(/^(-?)(\d+)\s*(?:°|d|\s|-)\s*(?:(\d+(?:\.\d+)?)\s*(?:'|′|m|-)?\s*(?:(\d+(?:\.\d+)?)\s*(?:"|″|''|s)?)?)?\s*$/i);
    if (!m) return NaN;
    const d = +m[2], mi = m[3] ? +m[3] : 0, se = m[4] ? +m[4] : 0;
    if (mi >= 60 || se >= 60) return NaN;
    const v = d + mi / 60 + se / 3600;
    return m[1] ? -v : v;
  }

  // Intersección de segmentos p1p2 y p3p4 (incluye extremos).
  function segIntersect(p1, p2, p3, p4) {
    const r = sub(p2, p1), s = sub(p4, p3), den = cross(r, s);
    const scale = len(r) * len(s);
    if (!scale || Math.abs(den) < 1e-12 * scale) return null;
    const qp = sub(p3, p1);
    const t = cross(qp, s) / den, u = cross(qp, r) / den;
    const e = 1e-12;
    if (t < -e || t > 1 + e || u < -e || u > 1 + e) return null;
    return { t, u, pt: add(p1, mul(r, t)) };
  }
  function distPointSeg(p, a, b) {
    const ab = sub(b, a), l2 = dot(ab, ab);
    let t = l2 ? dot(sub(p, a), ab) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    const pt = add(a, mul(ab, t));
    return { d: dist(p, pt), t, pt };
  }
  function nearestEdge(pts, p) {
    let best = -1, bd = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const r = distPointSeg(p, pts[i], pts[(i + 1) % pts.length]);
      if (r.d < bd) { bd = r.d; best = i; }
    }
    return best;
  }
  function pointInPolygon(p, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
    }
    return inside;
  }
  function onBoundary(p, pts, tol) {
    for (let i = 0; i < pts.length; i++) if (distPointSeg(p, pts[i], pts[(i + 1) % pts.length]).d <= tol) return true;
    return false;
  }

  // Validación según la precisión: vértices duplicados, colineales y autointersección.
  function validate(pts, tol) {
    tol = tol || 1e-4;
    const errors = [], n = pts ? pts.length : 0;
    if (n < 3) return { ok: false, errors: ['menos de 3 vértices'] };
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      if (dist(pts[i], pts[j]) < tol) { errors.push('vértices duplicados (' + (i + 1) + ' y ' + (j + 1) + ')'); i = n; break; }
    }
    for (let i = 0; i < n; i++) {
      const A = pts[(i - 1 + n) % n], B = pts[i], C = pts[(i + 1) % n];
      const l = dist(A, C);
      if (l > 0 && Math.abs(cross(sub(C, A), sub(B, A))) / l < tol && dot(sub(B, A), sub(C, A)) > 0 && dot(sub(B, C), sub(A, C)) > 0) {
        errors.push('vértice ' + (i + 1) + ' colineal'); break;
      }
    }
    outer: for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (j === i + 1 || (i === 0 && j === n - 1)) continue;
        if (segIntersect(pts[i], pts[(i + 1) % n], pts[j], pts[(j + 1) % n])) { errors.push('lados ' + (i + 1) + ' y ' + (j + 1) + ' se cruzan'); break outer; }
      }
    }
    if (!errors.length && area(pts) < tol * tol) errors.push('área nula');
    return { ok: errors.length === 0, errors };
  }

  // Quita vértices consecutivos repetidos y vértices colineales (altura < tol).
  function cleanRing(pts, tol) {
    tol = tol || 1e-7;
    let r = pts.filter((p, i) => dist(p, pts[(i + 1) % pts.length]) > tol);
    let changed = true;
    while (changed && r.length > 3) {
      changed = false;
      for (let i = 0; i < r.length; i++) {
        const A = r[(i - 1 + r.length) % r.length], B = r[i], C = r[(i + 1) % r.length];
        const l = dist(A, C);
        if (l > 0 && Math.abs(cross(sub(C, A), sub(B, A))) / l < tol && dot(sub(B, A), sub(C, B)) > 0) { r.splice(i, 1); changed = true; break; }
      }
    }
    return r;
  }

  // Corta un polígono (cóncavo o convexo) con la recta que pasa por P con
  // dirección dir. Devuelve todas las piezas: side = +1 a la izquierda de la
  // recta, -1 a la derecha. chords = tramos de la recta dentro del polígono.
  function cutPolygonByLine(ptsIn, P, dirIn, eps) {
    eps = eps == null ? 1e-9 : eps;
    const o = ptsIn[0];
    let pts = ptsIn.map(p => [p[0] - o[0], p[1] - o[1]]);
    if (signedArea(pts) < 0) pts = pts.slice().reverse();
    const Pl = [P[0] - o[0], P[1] - o[1]];
    const d = norm(dirIn);
    const back = p => [p[0] + o[0], p[1] + o[1]];
    const total = area(pts);
    if (!d[0] && !d[1]) return { pieces: [{ pts: ptsIn.slice(), side: 0, area: total }], chords: [] };
    const sd = p => cross(d, sub(p, Pl));
    const sp = p => dot(d, sub(p, Pl));
    const n = pts.length;
    const ds = pts.map(p => { const v = sd(p); return Math.abs(v) < eps ? 0 : v; });
    const ring = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      ring.push({ p: pts[i], on: ds[i] === 0 });
      if (ds[i] * ds[j] < 0) ring.push({ p: lerp(pts[i], pts[j], ds[i] / (ds[i] - ds[j])), on: true });
    }
    const m = ring.length;
    const sideOfAll = () => { let best = 0; for (const v of ds) if (Math.abs(v) > Math.abs(best)) best = v; return best >= 0 ? 1 : -1; };
    const onIdx = [];
    for (let k = 0; k < m; k++) if (ring[k].on) onIdx.push(k);
    const whole = () => ({ pieces: [{ pts: ptsIn.slice(), side: sideOfAll(), area: total }], chords: [] });
    if (onIdx.length < 2) return whole();
    onIdx.sort((a, b) => sp(ring[a].p) - sp(ring[b].p));
    const chords = [];
    const bTol = Math.max(eps * 100, 1e-8);
    for (let k = 0; k + 1 < onIdx.length; k++) {
      const a = onIdx[k], b = onIdx[k + 1];
      if (sp(ring[b].p) - sp(ring[a].p) < eps) continue;
      const mid = lerp(ring[a].p, ring[b].p, 0.5);
      if (pointInPolygon(mid, pts) && !onBoundary(mid, pts, bTol)) chords.push([a, b]);
    }
    if (!chords.length) return whole();
    // Grafo plano: lados del anillo (antihorario) + cuerdas en ambos sentidos.
    const out = Array.from({ length: m }, () => []);
    const edges = [];
    const addEdge = (a, b) => { const e = { a, b, used: false }; edges.push(e); out[a].push(e); };
    for (let k = 0; k < m; k++) addEdge(k, (k + 1) % m);
    for (const [a, b] of chords) { addEdge(a, b); addEdge(b, a); }
    const faces = [];
    for (const e0 of edges) {
      if (e0.used) continue;
      const face = []; let e = e0, guard = 0, ok = false;
      while (guard++ < 4 * edges.length) {
        e.used = true; face.push(e.a);
        const din = sub(ring[e.b].p, ring[e.a].p);
        let best = null, bestTurn = -Infinity;
        for (const c of out[e.b]) {
          if (c.b === e.a) continue;
          const dout = sub(ring[c.b].p, ring[c.a].p);
          const turn = Math.atan2(cross(din, dout), dot(din, dout));
          if (turn > bestTurn) { bestTurn = turn; best = c; }
        }
        if (!best) break;
        if (best === e0) { ok = true; break; }
        if (best.used) break;
        e = best;
      }
      if (!ok) continue;
      const fpts = face.map(k => ring[k].p);
      const a = signedArea(fpts);
      if (a <= eps) continue;
      let s = 0;
      for (const p of fpts) { const v = sd(p); if (Math.abs(v) > Math.abs(s)) s = v; }
      faces.push({ pts: fpts.map(back), side: s >= 0 ? 1 : -1, area: a });
    }
    if (!faces.length) return whole();
    return { pieces: faces, chords: chords.map(([a, b]) => [back(ring[a].p), back(ring[b].p)]) };
  }

  // Bisección: busca x en [lo, hi] con f(x) = target (f monótona).
  function bisect(f, lo, hi, target, tol, maxIter) {
    tol = tol == null ? 1e-4 : tol; maxIter = maxIter || 200;
    const flo = f(lo), fhi = f(hi);
    const res = { min: Math.min(flo, fhi), max: Math.max(flo, fhi) };
    if (Math.abs(flo - target) <= tol) return Object.assign(res, { x: lo, value: flo, ok: true, iter: 0 });
    if (Math.abs(fhi - target) <= tol) return Object.assign(res, { x: hi, value: fhi, ok: true, iter: 0 });
    if (target < res.min || target > res.max) return Object.assign(res, { x: NaN, value: NaN, ok: false, iter: 0 });
    const inc = fhi > flo;
    let a = lo, b = hi, x = lo, fx = flo, i = 0;
    for (; i < maxIter; i++) {
      x = (a + b) / 2; fx = f(x);
      if (Math.abs(fx - target) <= tol) return Object.assign(res, { x, value: fx, ok: true, iter: i + 1 });
      if ((fx < target) === inc) a = x; else b = x;
      if (Math.abs(b - a) <= 1e-14 * Math.max(1, Math.abs(x))) break;
    }
    return Object.assign(res, { x, value: fx, ok: Math.abs(fx - target) <= tol * 10, iter: i });
  }

  // Punto para rótulos: centroide, o el centro del tramo horizontal interior más ancho.
  function labelPoint(pts) {
    const o = pts[0]; let A = 0, cx = 0, cy = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = sub(pts[i], o), b = sub(pts[(i + 1) % pts.length], o), c = cross(a, b);
      A += c; cx += (a[0] + b[0]) * c; cy += (a[1] + b[1]) * c;
    }
    if (!A) return pts[0].slice();
    const C = [cx / (3 * A) + o[0], cy / (3 * A) + o[1]];
    if (pointInPolygon(C, pts)) return C;
    const xs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] > C[1]) !== (b[1] > C[1])) xs.push(a[0] + (C[1] - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
    }
    xs.sort((p, q) => p - q);
    let best = null;
    for (let i = 0; i + 1 < xs.length; i += 2) if (!best || xs[i + 1] - xs[i] > best[1] - best[0]) best = [xs[i], xs[i + 1]];
    return best ? [(best[0] + best[1]) / 2, C[1]] : C;
  }

  return { sub, add, mul, dot, cross, len, dist, norm, rotate, lerp, signedArea, area, perimeter, isClockwise,
    toClockwise, rotateToNorth, interiorAngles, formatDMS, parseAngle, segIntersect, distPointSeg, nearestEdge,
    pointInPolygon, validate, cleanRing, cutPolygonByLine, bisect, labelPoint };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = GEO;
</script>

<script>

function parseImport(obj, filename) {
  const out = { polys: [], skipped: 0, invalid: 0, open: 0, meta: { archivo: filename || '', fecha: '' } };
  let ents;
  if (obj && Array.isArray(obj.poligonos)) {
    out.meta.archivo = obj.dwg || filename || ''; out.meta.fecha = obj.fecha || '';
    ents = obj.poligonos.map(p => p && ({ id: p.id || p.handle, capa: p.capa, pts: p.v, cerrada: true }));
  } else if (obj && Array.isArray(obj.entidades)) {
    const cab = obj.cabecera || {}; const org = cab.origen || {};
    out.meta.archivo = org.archivo || filename || ''; out.meta.fecha = org.fecha || '';
    ents = obj.entidades.map(e => e && ({ id: e.id, capa: e.capa, pts: e.coords || e.coordenadas, cerrada: e.cerrada !== false && e.cerrada !== 'no' }));
  } else {
    throw new Error('Formato no reconocido: se esperaba la lista "poligonos" (EXTRAEPOL) o "entidades".');
  }
  for (const e of ents) {
    if (!e) continue;
    const capa = typeof e.capa === 'string' ? e.capa : '0';
    if (/^AMD-LINEA/i.test(capa)) { out.skipped++; continue; }
    if (!e.cerrada) { out.open++; continue; }
    let pts = sanitizePts(e.pts);
    if (!pts) { out.invalid++; continue; }
    pts = GEO.toClockwise(pts);
    if (!GEO.validate(pts, precTol()).ok) out.invalid++;
    out.polys.push({ id: String(e.id || genId()), capa, pts, fromCut: false, parent: null });
  }
  return out;
}

    if (st === 'side') edgeHL(this.hoverEdge, vLabel(this.hoverEdge) + '-' + vLabel((this.hoverEdge + 1) % n) + '  ' + fmt.d(GEO.dist(pts[this.hoverEdge], pts[(this.hoverEdge + 1) % n])) + ' m');

    }
    if (st === 'line') {
      edgeHL(this.c.i);
      const r = this.res;
      if (r) {
        for (const pc of r.pieces) {
          tracePath(pc.pts);
          if (!r.valid) { ctx.fillStyle = C.errSoft; ctx.fill(); ctx.strokeStyle = C.err; ctx.lineWidth = 1.5; }
          else if (pc.role === 'a1') { ctx.fillStyle = C.accentSoft; ctx.fill(); ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5; }
          else { ctx.fillStyle = C.neutral; ctx.fill(); ctx.strokeStyle = C.text2; ctx.lineWidth = 1; }

        const d = GEO.norm(r.line.dir), ext = 3 * Math.hypot(W, H) / S.view.scale;
        const g1 = w2s(GEO.add(r.line.P, GEO.mul(d, -ext))), g2 = w2s(GEO.add(r.line.P, GEO.mul(d, ext)));
        ctx.setLineDash([4, 5]); ctx.strokeStyle = C.hint; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(g1[0], g1[1]); ctx.lineTo(g2[0], g2[1]); ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle = r.valid ? C.accent : C.err; ctx.lineWidth = 2.2;

        const T = r.a1 + r.a2;
        for (const pc of r.pieces) {
          const lp = w2s(GEO.labelPoint(pc.pts)), k = pc.role.toUpperCase();
          const o = !r.valid ? { color: C.err, border: C.err } : pc.role === 'a1' ? { color: C.accent, border: C.accent } : { color: C.text2 };
          drawTag(lp[0], lp[1], [k + '  ' + fmt.a(pc.area) + ' m²', (pc.area / T * 100).toFixed(2) + ' %'], Object.assign({ bold: pc.role === 'a1' }, o));

      }
    }
  }
};

/* ---- entrada dinámica junto al cursor ---- */
const Dyn = {
  el: $('#dyn'), fields: [], visible: false,
  show(defs, opts) {
    this.exclusive = !!(opts && opts.exclusive);
    this.fields = defs.map(f => Object.assign({}, f));
    this.el.innerHTML = this.fields.map(f => '<label><span>' + esc(f.label) + '</span><input id="dyn-' + f.key + '" data-key="' + f.key + '" autocomplete="off" spellcheck="false" inputmode="decimal"><span>' + esc(f.unit || '') + '</span></label>').join('') +
      '<div class="hint">Tab: escribir · Enter: aplicar · Esc: volver</div>';
    this.fields.forEach(f => {
      f.input = this.el.querySelector('#dyn-' + f.key);
      f.input.addEventListener('input', () => {
        f.typed = true;
        // en la subdivisión solo un campo manda: al escribir uno se liberan los demás
        if (this.exclusive) for (const x of this.fields) if (x !== f) { x.typed = false; x.input.classList.remove('bad', 'locked'); }
        tool.onDynInput && tool.onDynInput(f.key, f.input.value);
      });
      f.input.addEventListener('focus', () => f.input.select());
      f.input.addEventListener('keydown', e => this.onKey(e, f));
    });
    this.visible = true; this.el.hidden = false; this.follow(true);
  },
  hide() { this.visible = false; this.el.hidden = true; this.fields = []; this.el.innerHTML = ''; },
  hasFocus() { return this.el.contains(document.activeElement); },
  setValues(vals) { for (const f of this.fields) if (!f.typed && document.activeElement !== f.input && vals[f.key] != null) f.input.value = vals[f.key]; },
  setField(key, v) { const f = this.fields.find(x => x.key === key); if (f) { f.input.value = v; f.typed = true; } },
  mark(key, bad, locked) { const f = this.fields.find(x => x.key === key); if (!f) return; f.input.classList.toggle('bad', !!bad); f.input.classList.toggle('locked', !!locked && !bad); },
  clear() { for (const f of this.fields) { f.typed = false; f.input.classList.remove('bad', 'locked'); } if (this.hasFocus()) document.activeElement.blur(); },
  focusNext(back) {
    if (!this.fields.length) return;
    const i = this.fields.findIndex(f => f.input === document.activeElement);
    const j = i < 0 ? (back ? this.fields.length - 1 : 0) : (i + (back ? -1 : 1) + this.fields.length) % this.fields.length;
    this.fields[j].input.focus();
  },
  typeInto(i, ch) {
    const f = this.fields[i]; if (!f) return;
    f.input.focus(); f.input.value = ch; f.typed = true; tool.onDynInput && tool.onDynInput(f.key, ch);
  },
  follow(force) {
    if (!this.visible || (!force && this.hasFocus())) return;
    if (!pointer.inside && !force) return;
    const r = this.el.getBoundingClientRect();
    // si no cabe a la derecha o abajo, pasa al otro lado del cursor (nunca lo tapa)
    let x = pointer.sx + 22, y = pointer.sy + 22;
    if (x + r.width > W - 4) x = pointer.sx - 22 - r.width;
    if (y + r.height > H - 4) y = pointer.sy - 22 - r.height;
    x = Math.max(4, x); y = Math.max(4, y);
    this.el.style.left = x + 'px'; this.el.style.top = y + 'px';
  },
  onKey(e, f) {
    e.stopPropagation();
    if (e.key === 'Tab') { e.preventDefault(); this.focusNext(e.shiftKey); return; }
    if (e.key === 'Enter') { e.preventDefault(); tool.enter && tool.enter(); return; }
    if (e.key === 'Escape') {
      e.preventDefault();
      const any = this.fields.some(x => x.typed);
      f.input.blur();
      if (any) { for (const x of this.fields) { x.typed = false; x.input.classList.remove('bad', 'locked'); } tool.escape && tool.escape(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'y')) return;
    // las letras son atajos (I invertir, C cerrar, D extremo), salvo d/m/s dentro de un ángulo
    if (e.key.length === 1 && /[a-zñ]/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const angular = f.kind === 'ang' || f.key === 'az';
      if (!(angular && /[dms]/i.test(e.key))) { e.preventDefault(); if (tool.onKey) tool.onKey(e); return; }
    }
    if (e.key === 'F3' || e.key === 'F8') { e.preventDefault(); e.key === 'F3' ? toggleSnap() : toggleOrtho(); }
  }
};

/* ---- menús ---- */
function buildMenu(el, items) {
  el.innerHTML = '';
  for (const it of items) {
    if (it.sep) { el.appendChild(document.createElement('hr')); continue; }
    if (it.header) { const h = document.createElement('div'); h.className = 'mh'; h.innerHTML = '<b>' + esc(it.header) + '</b>' + esc(it.sub || ''); el.appendChild(h); continue; }
    const b = document.createElement('button');
    b.innerHTML = esc(it.label) + (it.key ? '<span class="kbd">' + esc(it.key) + '</span>' : '');
    if (it.danger) b.className = 'del';

    el.appendChild(b);

};

async function copyTable(p) {
  const m = metrics(p.pts), n = p.pts.length, dc = S.settings.decCoord, dd = S.settings.decDist;
  const head = ['Vértice', 'Este', 'Norte', 'Lado', 'Distancia (m)', 'Ángulo interno'];

  for (let i = 0; i < n; i++) rows.push([vLabel(i), m.pr[i][0].toFixed(dc), m.pr[i][1].toFixed(dc), vLabel(i) + '-' + vLabel((i + 1) % n), m.dists[i].toFixed(dd), dmsSec(m.angSec[i])]);
  const foot = ['', '', '', 'Total', m.perim.toFixed(dd), dmsSec(m.angSum)];
  const tsv = [p.name + '\tÁrea ' + m.area.toFixed(dd) + ' m²\tPerímetro ' + m.perim.toFixed(dd) + ' m', head.join('\t')].concat(rows.map(r => r.join('\t')), [foot.join('\t')]).join('\n');
  const td = 'style="border:1px solid #d3dbe6;padding:3px 8px;font-family:Consolas,monospace;text-align:right"';
  const html = '<table style="border-collapse:collapse"><caption style="text-align:left;font-weight:bold">' + esc(p.name) + ' — Área ' + m.area.toFixed(dd) + ' m² · Perímetro ' + m.perim.toFixed(dd) + ' m</caption><tr>' + head.map(h => '<th ' + td.replace('right', 'center') + '>' + h + '</th>').join('') + '</tr>' +
    rows.concat([foot]).map(r => '<tr>' + r.map(c => '<td ' + td + '>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table>';
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/plain': new Blob([tsv], { type: 'text/plain' }), 'text/html': new Blob([html], { type: 'text/html' }) })]);
    } else await navigator.clipboard.writeText(tsv);
    msg('Tabla de ' + p.name + ' copiada. Péguela en Excel o Word.', 'ok');
  } catch (e) {
    try { await navigator.clipboard.writeText(tsv); msg('Tabla de ' + p.name + ' copiada como texto.', 'ok'); }
    catch (e2) { showText('Cuadro de vértices — ' + p.name, tsv, null); }
  }
}

/* ---- exportar / importar ---- */
function showText(title, text, filename, mime) {
  Modal.open({
    title,
    body: '<textarea id="expText" readonly spellcheck="false"></textarea><p style="font-size:12px">' + (filename ? 'Si la descarga no inicia (por ejemplo, dentro de una vista protegida), use Copiar y pegue el contenido en un archivo ' + esc(filename.split('.').pop()) + '.' : 'Seleccione el texto y cópielo.') + '</p>',
    actions: [{ label: 'Cerrar' },
      { label: 'Copiar', keepOpen: true, action: async (b) => { const ta = $('#expText'); try { await navigator.clipboard.writeText(text); b.textContent = 'Copiado'; } catch (e) { ta.focus(); ta.select(); b.textContent = 'Seleccionado: Ctrl+C'; } } }]
      .concat(filename ? [{ label: 'Descargar ' + filename.split('.').pop().toUpperCase(), primary: true, keepOpen: true, action: () => download(filename, text, mime) }] : []),
    onOpen: () => { $('#expText').value = text; }
  });
}
async function download(filename, text, mime) {
  // dentro del visor publicado se usa el permiso de descargas; abierto como archivo, un enlace normal
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data: text }); msg(filename + ' guardado.', 'ok'); }
      catch (e) { msg(e && e.code === 'declined' ? 'Descarga cancelada.' : 'No se pudo descargar aquí: use Copiar.', e && e.code === 'declined' ? '' : 'err'); }
      return;
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { msg('No se pudo descargar: use Copiar.', 'err'); }
}
function stampName() { const d = new Date(), z = n => String(n).padStart(2, '0'); return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes()); }
function exportJSON() {
  if (!S.doc.polys.length) { msg('No hay polígonos para exportar.', 'err'); return; }
  const base = (S.doc.meta.archivo || 'subdivision').replace(/\.[^.]+$/, '');
  showText('Exportar JSON · ' + S.doc.polys.length + ' entidades', buildExportJSON(), base + '_subdivision_' + stampName() + '.json', 'application/json');
}

  const r = buildCSV();
  if (!r.count) { msg('Aún no hay lotes nuevos: subdivida un predio primero.', 'err'); return; }
  showText('Coordenadas de ' + r.count + ' lotes nuevos', r.text, 'lotes_' + stampName() + '.csv', 'text/csv');

function handleImportText(text, filename) {
  let obj, r;
  try { obj = JSON.parse(text); } catch (e) { msg('El archivo no es un JSON válido: ' + e.message, 'err'); return; }
  try { r = parseImport(obj, filename); } catch (e) { msg(e.message, 'err'); return; }
  if (!r.polys.length) { msg('No se encontraron polígonos cerrados en ' + filename + '.', 'err'); return; }
  const notes = [];
  if (r.skipped) notes.push(r.skipped + ' de la capa AMD-LINEA omitidas');
  if (r.open) notes.push(r.open + ' abiertas omitidas');
  if (r.invalid) notes.push(r.invalid + ' con geometría inválida (se importan marcadas en rojo)');
  Modal.open({
    title: 'Importar ' + filename,
    body: '<p>Se encontraron <b>' + r.polys.length + '</b> polígonos' + (r.meta.fecha ? ' (fecha ' + esc(r.meta.fecha) + ')' : '') + '.</p>' + (notes.length ? '<p>' + esc(notes.join(' · ')) + '.</p>' : '') +
      '<p>¿Reemplaza el trabajo actual o agrega estos polígonos? Puede deshacerlo con Ctrl+Z.</p>',
    actions: [{ label: 'Cancelar' }, { label: 'Agregar', action: () => applyImport(r, false) }, { label: 'Reemplazar', primary: true, action: () => applyImport(r, true) }]
  });
}
function applyImport(r, replace) {
  if (tool !== SelectTool) setTool(SelectTool);
  commit(replace ? 'Importar (reemplazar)' : 'Importar (agregar)', () => {
    if (replace) { S.doc = { polys: [], originals: [], meta: r.meta }; S.ghosts = {}; }
    const ids = new Set(S.doc.polys.concat(S.doc.originals).map(p => p.id));
    for (const p of r.polys) {
      let id = p.id; while (ids.has(id)) id = p.id + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();
      ids.add(id);
      S.doc.polys.push(Object.assign({}, p, { id, name: nextName('Predio') }));
    }
    S.sel = null;
  });
  zoomExtents();
  msg((replace ? 'Importados ' : 'Agregados ') + r.polys.length + ' polígonos de ' + (r.meta.archivo || 'archivo') + '.', 'ok');
}
function readFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => handleImportText(String(fr.result), file.name);
  fr.onerror = () => msg('No se pudo leer el archivo.', 'err');
  fr.readAsText(file);
}

/* ---- eventos ---- */
let pan = null, spaceDown = false, lastMidDown = 0, down = null;
function localXY(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function updatePointer(e) {
  const [x, y] = localXY(e); pointer.sx = x; pointer.sy = y; pointer.w = s2w(x, y); pointer.inside = true;
  $('#sbCoords').innerHTML = '<span>E</span>' + fmt.c(pointer.w[0]) + '&nbsp;&nbsp;<span>N</span>' + fmt.c(pointer.w[1]);
}
function bindEvents() {
  cv.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });
  cv.addEventListener('pointerdown', e => {
    CtxMenu.hide(); $('#exportMenu').hidden = true;
    if (document.activeElement && document.activeElement !== document.body && !Dyn.hasFocus()) document.activeElement.blur();
    updatePointer(e);
    const touchPan = e.pointerType === 'touch' && tool === SelectTool;
    if (e.button === 1 || (e.button === 0 && spaceDown) || touchPan) {
      e.preventDefault();
      if (e.button === 1) {
        const now = performance.now();
        if (now - lastMidDown < 380) { lastMidDown = 0; zoomExtents(); return; }
        lastMidDown = now;
      }
      pan = { x: e.clientX, y: e.clientY, cx: S.view.cx, cy: S.view.cy, moved: false, touch: touchPan };
      cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing');
      return;
    }
    if (e.button === 0) down = { x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointermove', e => {
    updatePointer(e);
    if (pan) {
      const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
      if (Math.hypot(dx, dy) > 3) pan.moved = true;
      S.view.cx = pan.cx - dx / S.view.scale; S.view.cy = pan.cy + dy / S.view.scale;
      pointer.w = s2w(pointer.sx, pointer.sy); requestRender(); return;
    }
    if (tool.onMove) tool.onMove();
  });
  cv.addEventListener('pointerup', e => {
    if (pan) {
      const wasTap = pan.touch && !pan.moved; pan = null; cv.classList.remove('grabbing'); save();
      if (wasTap) { updatePointer(e); tool.onClick && tool.onClick(e); }
      return;
    }
    if (e.button === 0 && down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) { updatePointer(e); tool.onClick && tool.onClick(e); }
    down = null; renderTop();
  });
  cv.addEventListener('pointerleave', () => { pointer.inside = false; if (!pan) { SnapMark = null; if (tool.onLeave) tool.onLeave(); requestRender(); } });
  cv.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = localXY(e); zoomAt(x, y, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0016))); }, { passive: false });
  cv.addEventListener('contextmenu', e => {
    e.preventDefault(); updatePointer(e); HoverMenu.hide();
    const items = tool.contextItems ? tool.contextItems() : [];
    if (items.length) CtxMenu.show(items, pointer.sx, pointer.sy);
  });
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; cv.classList.remove('grab'); } });
  window.addEventListener('blur', () => { spaceDown = false; cv.classList.remove('grab'); });
  window.addEventListener('pointerdown', e => {
    if (!$('#ctxMenu').contains(e.target) && e.target !== cv) CtxMenu.hide();
    if (!e.target.closest('.dropdown')) $('#exportMenu').hidden = true;
    if (window.innerWidth <= 900 && !e.target.closest('.left,.right,#btnLeft,#btnRight,.modalback')) $('#app').classList.remove('show-left', 'show-right');
  });
  new ResizeObserver(() => resize()).observe($('#main'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); requestRender(); });

  document.querySelectorAll('.toolbtn').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.tool;
    if (t === 'select') setTool(SelectTool); else if (t === 'poly') setTool(PolyTool); else startSubdiv();
  }));
  $('#polySearch').addEventListener('input', renderLeft);
  $('#polyList').addEventListener('click', e => {
    const li = e.target.closest('.item'); if (!li || !li.dataset.id) return;
    const id = li.dataset.id, p = S.doc.polys.find(q => q.id === id); if (!p) return;
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'zoom') { select(id); zoomExtents([p]); }
      if (act.dataset.act === 'sub') { if (tool !== SelectTool) setTool(SelectTool); select(id); startSubdiv(); }
      if (act.dataset.act === 'del') { select(id); askDelete(); }
      return;
    }
    if (tool !== SelectTool) setTool(SelectTool);
    select(S.sel === id ? null : id);
  });
  $('#polyList').addEventListener('dblclick', e => { const li = e.target.closest('.item'); const p = li && S.doc.polys.find(q => q.id === li.dataset.id); if (p) zoomExtents([p]); });
  $('#origToggle').addEventListener('click', () => { const l = $('#origList'); l.hidden = !l.hidden; $('#origSec').classList.toggle('open', !l.hidden); });
  $('#origList').addEventListener('click', e => {
    const li = e.target.closest('.item'); if (!li || !li.dataset.oid) return;
    const id = li.dataset.oid;

  $('#fileInput').addEventListener('change', e => { readFile(e.target.files[0]); e.target.value = ''; });
  $('#btnExport').addEventListener('click', () => { const m = $('#exportMenu'); m.hidden = !m.hidden; });
  $('#exportMenu').addEventListener('click', e => { const b = e.target.closest('[data-exp]'); if (!b) return; $('#exportMenu').hidden = true; b.dataset.exp === 'json' ? exportJSON() : exportCSV(); });
  $('#btnUndo').addEventListener('click', doUndo);
  $('#btnRedo').addEventListener('click', doRedo);
  $('#btnSettings').addEventListener('click', openSettings);
  $('#togSnap').addEventListener('click', toggleSnap);
  $('#togOrtho').addEventListener('click', toggleOrtho);
  $('#btnExtents').addEventListener('click', () => zoomExtents());
  $('#btnLeft').addEventListener('click', () => { $('#app').classList.toggle('show-left'); $('#app').classList.remove('show-right'); });
  $('#btnRight').addEventListener('click', () => { $('#app').classList.toggle('show-right'); $('#app').classList.remove('show-left'); });
  $('#modalBack').addEventListener('pointerdown', e => { if (e.target === $('#modalBack')) Modal.close(); });
  // arrastrar y soltar un JSON sobre la ventana
  let dropEl = null;
  window.addEventListener('dragover', e => { e.preventDefault(); if (!dropEl) { dropEl = document.createElement('div'); dropEl.className = 'drop'; dropEl.textContent = 'Suelte el archivo JSON para importarlo'; document.body.appendChild(dropEl); } });
  window.addEventListener('dragleave', e => { if (e.relatedTarget == null && dropEl) { dropEl.remove(); dropEl = null; } });
  window.addEventListener('drop', e => { e.preventDefault(); if (dropEl) { dropEl.remove(); dropEl = null; } readFile(e.dataTransfer.files[0]); });
}
function onKeyDown(e) {
  if (Modal.isOpen()) { if (e.key === 'Escape') { e.preventDefault(); Modal.close(); } return; }
  const t = e.target;
  if (Dyn.el.contains(t)) return;
  if (e.key === 'F3') { e.preventDefault(); toggleSnap(); return; }
  if (e.key === 'F8') { e.preventDefault(); toggleOrtho(); return; }
  const inCmd = t === cmdInput;
  const inField = !inCmd && t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if (inField) return;
  const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (mod && key === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); return; }
  if (mod && (key === 'y' || (key === 'z' && e.shiftKey))) { e.preventDefault(); doRedo(); return; }
  if (inCmd) {
    if (e.key === 'Enter') { e.preventDefault(); const v = cmdInput.value; cmdInput.value = ''; cmdInput.blur(); runCommand(v); return; }
    if (e.key === 'Escape') { e.preventDefault(); if (cmdInput.value) cmdInput.value = ''; else { cmdInput.blur(); tool.escape && tool.escape(); } return; }
    if (e.key === 'Tab') { e.preventDefault(); cmdInput.blur(); tool.tab && tool.tab(e.shiftKey); return; }
    if (e.key === 'ArrowUp' && cmdHistory.length) { e.preventDefault(); histIdx = histIdx < 0 ? cmdHistory.length - 1 : Math.max(0, histIdx - 1); cmdInput.value = cmdHistory[histIdx]; return; }
    if (e.key === 'ArrowDown' && histIdx >= 0) { e.preventDefault(); histIdx = Math.min(cmdHistory.length, histIdx + 1); cmdInput.value = cmdHistory[histIdx] || ''; if (histIdx >= cmdHistory.length) histIdx = -1; return; }
    return;
  }
  if (mod || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); spaceDown = true; cv.classList.add('grab'); return; }
  switch (e.key) {
    case 'Escape': e.preventDefault(); CtxMenu.hide(); tool.escape && tool.escape(); return;
    case 'Enter': e.preventDefault(); tool.enter && tool.enter(); return;
    case 'Tab': e.preventDefault(); tool.tab && tool.tab(e.shiftKey); return;
    case 'Backspace': e.preventDefault(); tool.backspace && tool.backspace(); return;
    case 'Delete': e.preventDefault(); if (tool === SelectTool) askDelete(); return;
  }
  if (tool.onKey && tool.onKey(e)) { e.preventDefault(); return; }
  if (e.key.length === 1) {
    e.preventDefault();
    if (Dyn.visible && /[0-9.\-]/.test(e.key)) { Dyn.typeInto(0, e.key); return; }
    cmdInput.focus(); cmdInput.value += e.key;
  }
}

/* ---- arranque ---- */
function init() {
  readColors(); bindEvents();
  let ok = false;
  try { ok = load(); } catch (e) { console.warn('No se pudieron cargar los datos guardados:', e); ok = false; }
  if (!ok) {
    S.doc = { polys: [], originals: [], meta: { archivo: '', fecha: '' } };
    try {
      const r = parseImport(SAMPLE_DATA, 'APV_Obraje.dwg');
      S.doc.meta = r.meta;
      for (const p of r.polys) S.doc.polys.push(Object.assign({}, p, { name: nextName('Predio') }));
    } catch (e) { console.warn('Ejemplo no disponible:', e); }
  }
  applyTheme();
  resize();
  if (!S.view.restored) zoomExtents();
  setTool(SelectTool);
  msg(ok ? 'Trabajo recuperado de este navegador.' : 'Ejemplo cargado: ' + (S.doc.meta.archivo || '') + '. Haga clic en un predio y escriba SUB para subdividir.', 'ok');
}
try { init(); } catch (e) {
  console.error(e);
  // guarda un respaldo de los datos y los aparta para que la próxima carga arranque limpia
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) localStorage.setItem(STORE_KEY + '.respaldo', raw); localStorage.removeItem(STORE_KEY); } catch (e2) { }
  document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#fcebea;color:#d23b30;padding:8px 14px;border-radius:6px;z-index:99">Error al iniciar. Recargue la página.</div>');
}
</script>
